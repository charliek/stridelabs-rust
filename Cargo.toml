# Virtual workspace. Each shared crate lives under `crates/*` with its own
# Cargo.toml; there is no root package. One `target/` and one `Cargo.lock` for
# the whole repo.
[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
# Lockstep versioning: every crate in this workspace ships at the same
# version, bumped together at release time regardless of which crate(s)
# changed. Consumers pin a single git rev/tag for the whole set.
version = "0.8.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
authors = ["Charlie Knudsen"]
repository = "https://github.com/charliek/stridelabs-rust"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server / middleware
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = "0.7"
# Request/response types for tower layers that stay axum-compatible without
# depending on axum itself (axum re-exports this same `http` crate).
http = "1"

# Intra-workspace. Declared here so a member says `{ workspace = true }` like
# every other dependency, and moving a crate is a one-line edit.
stridelabs-http = { path = "crates/http" }
stridelabs-auth = { path = "crates/auth" }
# stridelabs-mcp's `redis` feature (the Redis-backed rate limiter and PAT
# cache) is built on it.
stridelabs-redis = { path = "crates/redis" }
# Only the real-Redis tests use it (stridelabs-redis's and stridelabs-mcp's):
# a dev-dependency whose `redis` feature each crate's `live-tests` feature
# switches on.
stridelabs-testing = { path = "crates/testing" }

# HTTP client (proxy primitives, the SSRF-guarded fetch, JWKS fetch, PAT
# validation, GCP calls). Deliberately NO TLS feature here: whatever is listed
# at workspace level reaches every member's graph, and so every consumer's.
# reqwest 0.13's `rustls` switches on rustls's aws-lc-rs provider, and next to
# a consumer's rustls `ring` (redis-rs 0.27's `tls-rustls`, sqlx
# `tls-rustls-ring`) every `rustls::ClientConfig::builder()` that relies on the
# crate-feature default panics. Only stridelabs-http's `proxy` and `ssrf` build
# a client of their own, so only they turn reqwest's TLS on
# (crates/http/Cargo.toml). stridelabs-auth and stridelabs-gcp are handed the
# consumer's client and must not pick a TLS stack for it; CI's "Guard:
# stridelabs-auth pulls no rustls" keeps rustls out of stridelabs-auth's graph.
reqwest = { version = "0.13", default-features = false }

# OpenAPI. No schema features (`uuid`, `time`, …) here: the shared crate
# derives no schemas of its own, and a consumer that does declares its own
# `utoipa` with whatever its types need — Cargo unifies the two. A consumer
# that routes through `utoipa_axum::OpenApiRouter` pairs this major with
# utoipa-axum 0.3 (0.2 supports only utoipa 5); this workspace does not
# depend on utoipa-axum itself.
utoipa = "6"

# MCP (Model Context Protocol) server SDK, for stridelabs-mcp. Default
# features off: rmcp's defaults are `server` + `macros` + `base64`, and its
# optional `__reqwest`/`auth` features bring an HTTP client (with a TLS feature
# of their own choosing) and the `oauth2` crate, neither of which a resource
# server needs. `server` (the `ServerHandler` trait and model, implies
# `schemars`) and `transport-streamable-http-server` (the tower
# `StreamableHttpService`) are the whole requirement. `macros` (`#[tool]`,
# `#[tool_router]`) is a consumer's choice for writing its tools, so it is
# only on in stridelabs-mcp's dev-dependencies; a consumer names it on its
# own rmcp dependency.
rmcp = { version = "3.5", default-features = false, features = [
    "server",
    "schemars",
    "transport-streamable-http-server",
] }

# Serialization / config parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
serde_path_to_error = "0.1"

# Errors
thiserror = "2"
anyhow = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# Database. Deliberately NO `tls-*` feature: stridelabs-testing's pool talks to
# a local/CI Postgres without TLS, and any TLS feature here would unify into a
# consumer's test graph (`ring` next to reqwest 0.13's aws-lc-rs makes
# `rustls::ClientConfig::builder()` panic). CI's "Guard: stridelabs-testing
# pulls no ring" step fails if a TLS feature brings `ring` back.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "time",
    "migrate",
    "macros",
] }

# Redis (stridelabs-redis's lazy handle, stridelabs-testing's `require_redis`).
# `default-features = false` drops `acl`, `streams`, `geospatial`, `script` and
# `num-bigint`, none of which either crate uses. `script` exists for `Script`'s
# EVALSHA caching (and pulls in `sha1_smol`); the one script here, the fixed
# window, goes out as a raw `EVAL` through `redis::cmd`, which needs nothing
# from it. `tokio-comp` is the async runtime glue.
#
# Deliberately NO TLS feature at this level, for the reqwest reason above:
# whatever is listed here reaches every member's graph, and so every
# consumer's. stridelabs-redis turns `tokio-rustls-comp` on for itself
# (crates/redis/Cargo.toml says why it must); stridelabs-testing's probe talks
# to a local or CI Redis in the clear, as its Postgres pool does.
redis = { version = "1", default-features = false, features = ["tokio-comp"] }

# Auth (slauth JWT verification + PAT hashing). default-features = false drops
# `use_pem` (pem + simple_asn1 + ~11 transitive crates) from production graphs:
# verification decodes keys from the JWKS, never PEM. Only offline test-token
# minting needs PEM, and stridelabs-auth's `test-support` feature re-enables it.
#
# Exactly ONE crypto backend must be on across the whole unified graph: with
# none, or with both `aws_lc_rs` and `rust_crypto` (a consumer's own
# jsonwebtoken features unify with these), jsonwebtoken 10+ compiles cleanly and
# then panics at its first sign or verify. `aws_lc_rs`, because aws-lc-rs is
# already the house rustls provider (reqwest 0.13's `rustls`), and
# `rust_crypto` would bring back the `rsa` crate (RUSTSEC-2023-0071, no fix
# upstream). Consumers must never enable `rust_crypto`. stridelabs-auth's
# `signing_and_verifying_work_on_the_one_crypto_backend` panics if this breaks.
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
sha2 = "0.11"
# stridelabs-gcp decodes a base64 service-account key (the GOOGLE_CREDENTIALS
# convention) and Vertex `inlineData` image bytes. 0.22, the major
# jsonwebtoken 11 and wiremock already lock, so no second copy.
base64 = "0.22"

# Misc
rand = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde"] }
bytes = "1"
futures = "0.3"
url = "2"
# stridelabs-gcp: GCS object names are percent-encoded into a path segment or
# query value, `/` included. Already in every graph through `url` and reqwest.
percent-encoding = "2"
# stridelabs-gcp: finding a candidate multipart boundary in a part (`memmem`,
# linear in a 10 MiB image). Already in every graph through futures-util.
memchr = "2"

# Test-only
wiremock = "0.6"

[workspace.lints.rust]
# Shared library crates: no unsafe code has ever been needed, so forbid it
# outright rather than relying on reviewers to catch a stray `unsafe` block.
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = "limited"
