name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly, so `audit`'s time-varying RustSec findings get re-checked even
  # when nobody opens a PR for a while — a new advisory can land against a
  # dependency with no code change here. `build-test` is skipped on this
  # trigger (see its own `if:` below) since there's nothing to rebuild;
  # `ci-success` still runs and requires `audit` and `downstream-limen`, so
  # the run's conclusion reflects both, and a failing `audit` also opens or
  # updates a `security` issue (`audit-issue` below) so it isn't missed.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # Scheduled (weekly) runs exist to re-check what can change with no
    # commit here (`audit`'s advisories, `downstream-limen`'s re-resolve), not
    # to rebuild the workspace — skip this job on that trigger so a cron run
    # doesn't burn a full build-test matrix for nothing.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    # Postgres and Redis for the fail-loud integration tests the all-features
    # lane compiles in: stridelabs-testing's `require_postgres` and
    # `require_redis`, and stridelabs-redis's live suite. Mapped to 5438 and
    # 6390 to match docker-compose.yml / the local dev ports.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: stridelabs_test
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:localdev@localhost:5438/stridelabs_test
      REDIS_URL: redis://localhost:6390/0

    steps:
      # fetch-depth: 0 (full history + tags) is needed below by
      # `git describe --tags` for the cargo-semver-checks baseline — a
      # shallow, depth-1 checkout wouldn't have any tag objects to describe
      # against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # v2 enforces warning-free builds with CARGO_BUILD_WARNINGS=deny (cargo's
      # `build.warnings`, needs cargo >= 1.97; the pinned 1.97.1 qualifies),
      # replacing v1's implicit RUSTFLAGS="-D warnings". Stated here rather
      # than left to the action's default. Unlike RUSTFLAGS it also fails on
      # rustdoc warnings, so the Doc lane below is gated too.
      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          build-warnings: deny

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (all targets, all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test (default features)
        run: cargo test --workspace --locked

      - name: Test (all features)
        run: cargo test --workspace --all-features --locked

      # The `#[cfg(not(debug_assertions))]` counterparts of the
      # `custom_client`/`method_filter`/XFP-override misuse tests in
      # error.rs, methods.rs and proxy/forwarded.rs only compile in (and the
      # debug-only `#[cfg(debug_assertions)]` arms only compile out) under a
      # release profile — `cargo test` above always runs the crate's dev/test
      # profile, which keeps `debug_assert!` live regardless of `--release`
      # being passed to *other* commands. Without this step those
      # release-only arms are never exercised by CI at all.
      - name: Test (stridelabs-http, release profile)
        run: cargo test -p stridelabs-http --release --all-features --locked

      - name: Build (no default features)
        run: cargo build --workspace --no-default-features --locked

      - name: Doc
        run: cargo doc --workspace --all-features --no-deps --locked

      # Dependency-graph guards. A consumer's build unifies features across its
      # whole graph, so what a crate here enables is what the consumer compiles;
      # these steps fail the moment a forbidden crate re-enters.
      #
      # Each, except the rsa guard (which reads the lock; its own comment says
      # why), asserts on a package LISTING (`cargo tree ... --prefix none
      # --format '{p}'`, first word of each line, de-duplicated), never on
      # `cargo tree -i`: `-i` exits 101 when the crate is absent, which is
      # indistinguishable from cargo breaking, so a guard built on it either
      # always fails or passes vacuously. A listing is checked for the
      # forbidden crate being ABSENT and for a positive control being PRESENT:
      # without the control, an empty or mis-scoped listing (a dropped
      # `--features`, a wrong `-p`) would pass for the wrong reason. An empty
      # listing or a cargo error fails the step (`set -euo pipefail`).
      # `--target all` so a platform-gated edge cannot hide the crate; `-e
      # normal` because that is what reaches a consumer's build (the ring
      # guard adds build and dev edges: it asks what the workspace compiles).
      #
      # `ring` enabled on rustls next to the aws-lc-rs provider that reqwest
      # 0.13's `rustls` feature brings leaves rustls with no unambiguous
      # process-level CryptoProvider, so `rustls::ClientConfig::builder()`
      # panics at runtime, on a TLS connect no dev or CI test reaches. sqlx's
      # `tls-rustls-ring` is how ring got into stridelabs-testing, so its pool
      # is built with no sqlx TLS feature (it talks to a local Postgres without
      # TLS).
      - name: "Guard: stridelabs-testing pulls no ring"
        run: |
          set -euo pipefail
          pkgs="$(mktemp)"
          trap 'rm -f "$pkgs"' EXIT
          cargo tree --locked --target all -e normal -p stridelabs-testing --features postgres \
            --prefix none --format '{p}' | awk '{print $1}' | sort -u > "$pkgs"
          echo "$(wc -l < "$pkgs") packages in stridelabs-testing[postgres]'s normal graph"
          if [ ! -s "$pkgs" ]; then
            echo "::error::the stridelabs-testing package listing is empty; the guard proved nothing"
            exit 1
          fi
          if ! grep -qx sqlx "$pkgs"; then
            echo "::error::positive control failed: sqlx is not in stridelabs-testing[postgres]'s graph, so this listing is not the one the guard means to inspect"
            exit 1
          fi
          if grep -qx ring "$pkgs"; then
            echo "::error::ring is in stridelabs-testing[postgres]'s graph; re-enabling a sqlx tls-rustls-ring feature puts it in every consumer's test graph"
            cargo tree --locked --target all -e normal -p stridelabs-testing --features postgres -i ring || true
            exit 1
          fi
          echo "ok: ring absent, sqlx present"

      # The same panic from the other side: stridelabs-auth sits in consumers'
      # PRODUCTION graphs, and a TLS feature on its reqwest would put rustls's
      # aws-lc-rs provider next to whatever provider the consumer chose (ring,
      # for redis-rs or sqlx `tls-rustls-ring`). It never builds a client
      # outside its tests (`Verifier::new`/`JwksCache::new` take the
      # consumer's), so it has no TLS feature at all and the TLS stack stays the
      # consumer's choice. Two listings. Default features, as a consumer that
      # names the crate with no `features` gets it. Then every feature: a
      # consumer of `stridelabs-auth[http]` (the usual production shape) also
      # gets whatever auth's features pull from stridelabs-http, and
      # stridelabs-http's `proxy` IS TLS, so a feature edge to it would put
      # aws-lc-rs in that consumer's graph with the default listing still
      # green. Features only add crates, so rustls absent with all of them on
      # is absent from every combination; `stridelabs-http` is that listing's
      # second positive control, proving the feature edge was walked.
      - name: "Guard: stridelabs-auth pulls no rustls"
        run: |
          set -euo pipefail
          pkgs="$(mktemp)"
          trap 'rm -f "$pkgs"' EXIT
          cargo tree --locked --target all -e normal -p stridelabs-auth \
            --prefix none --format '{p}' | awk '{print $1}' | sort -u > "$pkgs"
          echo "$(wc -l < "$pkgs") packages in stridelabs-auth's normal graph"
          if [ ! -s "$pkgs" ]; then
            echo "::error::the stridelabs-auth package listing is empty; the guard proved nothing"
            exit 1
          fi
          if ! grep -qx jsonwebtoken "$pkgs"; then
            echo "::error::positive control failed: jsonwebtoken is not in stridelabs-auth's graph, so this listing is not the one the guard means to inspect"
            exit 1
          fi
          if grep -qx rustls "$pkgs"; then
            echo "::error::rustls is in stridelabs-auth's graph; a reqwest TLS feature on it picks a rustls provider for every consumer"
            cargo tree --locked --target all -e normal -p stridelabs-auth -i rustls || true
            exit 1
          fi
          echo "ok: rustls absent, jsonwebtoken present"
          cargo tree --locked --target all -e normal -p stridelabs-auth --all-features \
            --prefix none --format '{p}' | awk '{print $1}' | sort -u > "$pkgs"
          echo "$(wc -l < "$pkgs") packages in stridelabs-auth[all features]'s normal graph"
          if [ ! -s "$pkgs" ]; then
            echo "::error::the stridelabs-auth[all features] package listing is empty; the guard proved nothing"
            exit 1
          fi
          for control in jsonwebtoken stridelabs-http; do
            if ! grep -qx "$control" "$pkgs"; then
              echo "::error::positive control failed: $control is not in stridelabs-auth[all features]'s graph, so this listing is not the one the guard means to inspect"
              exit 1
            fi
          done
          if grep -qx rustls "$pkgs"; then
            echo "::error::rustls is in stridelabs-auth[all features]'s graph; a stridelabs-auth feature turns on TLS (an edge to stridelabs-http's proxy, say) for every consumer that enables it"
            cargo tree --locked --target all -e normal -p stridelabs-auth --all-features -i rustls || true
            exit 1
          fi
          echo "ok: rustls absent with every feature on, jsonwebtoken and stridelabs-http present"

      # stridelabs-mcp sits in consumers' production graphs too, with the same
      # reason to pick no TLS stack: its reqwest (no features) is only the
      # `reqwest::Client` type `McpVerifier::new` takes from the consumer, and
      # rmcp is built with default features off, so neither its HTTP client
      # (`__reqwest`, with a TLS feature of its own) nor its OAuth client
      # (`auth`) comes along. One listing with every feature on (features
      # only add crates); rmcp and jsonwebtoken are the positive controls,
      # proving the listing walked both the transport and the verifier.
      - name: "Guard: stridelabs-mcp pulls no rustls"
        run: |
          set -euo pipefail
          pkgs="$(mktemp)"
          trap 'rm -f "$pkgs"' EXIT
          cargo tree --locked --target all -e normal -p stridelabs-mcp --all-features \
            --prefix none --format '{p}' | awk '{print $1}' | sort -u > "$pkgs"
          echo "$(wc -l < "$pkgs") packages in stridelabs-mcp[all features]'s normal graph"
          if [ ! -s "$pkgs" ]; then
            echo "::error::the stridelabs-mcp package listing is empty; the guard proved nothing"
            exit 1
          fi
          for control in rmcp jsonwebtoken; do
            if ! grep -qx "$control" "$pkgs"; then
              echo "::error::positive control failed: $control is not in stridelabs-mcp[all features]'s graph, so this listing is not the one the guard means to inspect"
              exit 1
            fi
          done
          if grep -qx rustls "$pkgs"; then
            echo "::error::rustls is in stridelabs-mcp[all features]'s graph; a TLS feature (on its reqwest, or an rmcp client feature) picks a rustls provider for every consumer"
            cargo tree --locked --target all -e normal -p stridelabs-mcp --all-features -i rustls || true
            exit 1
          fi
          echo "ok: rustls absent with every feature on, rmcp and jsonwebtoken present"

      # rsa (RUSTSEC-2023-0071, no upstream fix) has to stay out of the lock
      # entirely: cargo-audit reads Cargo.lock, so even a crate that is never
      # compiled would put the advisory back, and `cargo tree` cannot see
      # lock-only entries. It left with sqlx 0.9 (mysql auth needs the opt-in
      # `mysql-rsa` feature); jsonwebtoken's `rust_crypto` backend would bring
      # it back. Checked on the lock itself, not on a listing. (`if`, not a
      # bare `! grep`: a negated command never trips `bash -e`.)
      - name: "Guard: no rsa in Cargo.lock"
        run: |
          if grep -qx 'name = "rsa"' Cargo.lock; then
            echo "::error::rsa is in Cargo.lock (RUSTSEC-2023-0071, no fix); find what pulls it with: cargo tree --locked --target all --all-features -i rsa"
            exit 1
          fi
          echo "ok: no rsa in Cargo.lock"

      # aws-lc-rs is the only crypto provider anything here compiles: rustls's
      # under reqwest 0.13's `rustls`, and jsonwebtoken 11's `aws_lc_rs`
      # backend. ring compiled next to it is the second provider that makes
      # `rustls::ClientConfig::builder()` panic in a consumer's process. ring
      # left the compiled graph with jsonwebtoken 9, but it stays in Cargo.lock
      # through optional edges nothing compiles: quinn-proto's wasm32-only ring
      # dependency, reached through reqwest's optional quinn (its `http3` is
      # off), and rustls-webpki's `ring` feature, which is off. So a lock grep
      # (the rsa guard's shape, right for cargo-audit, which reads the lock)
      # would fail on a ring that is never built. The check is a listing of
      # what the workspace compiles: every member, every feature, every target,
      # normal, build and dev edges, with aws-lc-rs as the positive control.
      - name: "Guard: the workspace compiles no ring"
        run: |
          set -euo pipefail
          pkgs="$(mktemp)"
          trap 'rm -f "$pkgs"' EXIT
          cargo tree --locked --workspace --all-features --target all -e normal,build,dev \
            --prefix none --format '{p}' | awk '{print $1}' | sort -u > "$pkgs"
          echo "$(wc -l < "$pkgs") packages in the workspace's compiled graph"
          if [ ! -s "$pkgs" ]; then
            echo "::error::the workspace package listing is empty; the guard proved nothing"
            exit 1
          fi
          if ! grep -qx aws-lc-rs "$pkgs"; then
            echo "::error::positive control failed: aws-lc-rs is not in the workspace's compiled graph, so this listing is not the one the guard means to inspect"
            exit 1
          fi
          if grep -qx ring "$pkgs"; then
            echo "::error::ring is in the workspace's compiled graph; next to aws-lc-rs it is a second crypto provider, and rustls::ClientConfig::builder() panics"
            cargo tree --locked --workspace --all-features --target all -e normal,build,dev -i ring || true
            exit 1
          fi
          echo "ok: ring absent, aws-lc-rs present"

      # deny.toml's license/bans/sources gates (verified clean locally:
      # `cargo deny check licenses bans sources`). Deliberately does NOT
      # include `advisories` in this list — that would duplicate the
      # separate `audit` job below. See deny.toml's `[advisories]` comment
      # for why that split exists: exactly one tool (cargo-audit) is the
      # authority on "is there a live advisory," and it stays out of this
      # job so a new RUSTSEC ID can't brick unrelated PRs (`audit` is
      # advisory on pull requests; see `ci-success`). (The action's default
      # `arguments` input already passes `--all-features`, matching
      # deny.toml's own `[graph] all-features = true` — redundant but
      # harmless, kept as the belt to the config file's suspenders rather
      # than relying on the action's default not changing.)
      - name: cargo-deny (licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          command-arguments: licenses bans sources

      - name: Determine cargo-semver-checks baseline tag
        id: semver-baseline
        run: |
          tag="$(git describe --tags --abbrev=0 --match 'v*')"
          echo "Baseline tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Pinned: an unpinned install floats to the newest release, so a tool
      # upgrade could change what this gate reports with no change here.
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-semver-checks@0.51.0

      # A real gate: the baseline above is the latest reachable `v*` tag, and
      # a crate whose public API breaks against it fails this step. Under 0.x
      # a breaking change is legal only with a minor bump, so every breaking
      # PR must bump `[workspace.package].version` itself. That is why this
      # passes at 0.5.0 against the v0.4.0 baseline (the breaks since v0.4.0,
      # e.g. `LogFormat` becoming `#[non_exhaustive]`, are covered by the
      # bump), and why, once v0.5.0 is tagged and becomes the baseline, the
      # next break needs 0.6.0. The version bump is the fix; never put
      # `continue-on-error` back.
      #
      # Every crate here has `publish = false` (crates/*/Cargo.toml) — a
      # `--workspace` cargo-semver-checks invocation silently NO-OPS against
      # a workspace where every member opts out of publishing (verified: its
      # entire output is a single "Cloning <tag>" line, no "Checking"/
      # "Summary" line, exit 0, no warning). This MUST stay a per-crate `-p`
      # loop; do not "simplify" it back to `--workspace`.
      #
      # `set +e`: Actions runs `run:` blocks under `bash -e`, and `set -uo
      # pipefail` alone does not clear that, so the `out="$(…)"` assignment
      # below would abort the whole script the first time a crate fails —
      # silently skipping every crate after it (and its diagnostics, because
      # `echo "$out"` never ran). With -e off, every crate is checked and
      # printed, failures are accumulated, and the step exits non-zero once
      # at the end.
      #
      # The loop also guards against the `--workspace` no-op reappearing
      # *inside* a per-crate `-p` invocation in some future tool version: a
      # real check always prints a line containing "Summary" (verified
      # locally against cargo-semver-checks 0.51.0 — "Summary no semver
      # update required" / "Summary semver requires new..."). If that line
      # is missing, the crate was silently skipped rather than actually
      # checked, and that is treated as a hard failure of this step
      # regardless of cargo-semver-checks's own exit code — a vacuously
      # "passing" check is worse than a loudly failing one.
      #
      # A crate added since the baseline tag has no API there to break, and
      # cargo-semver-checks cannot build a baseline for it (it exits 101 with
      # no "Summary" line). Such a crate, one whose crates/<name>/Cargo.toml
      # (crate `stridelabs-<name>`) is absent at the baseline tag, is named in
      # a notice and passed over; from the next tag on it is checked like the
      # rest. Only an absent manifest counts: a manifest that is there but
      # does not build still fails below. `git cat-file -e` cannot tell an
      # absent manifest from a baseline that does not resolve, so the baseline
      # is resolved first, and a run that checked no crate at all fails: a
      # skip of every crate would be the vacuous pass this step exists to
      # refuse.
      - name: cargo-semver-checks (every crate)
        run: |
          set +e -uo pipefail
          baseline="${{ steps.semver-baseline.outputs.tag }}"
          if ! git rev-parse --verify --quiet "$baseline^{commit}" >/dev/null; then
            echo "::error::the baseline '$baseline' does not resolve to a commit; nothing can be checked against it"
            exit 1
          fi
          status=0
          failed=""
          checked=0
          for crate in stridelabs-config stridelabs-observability stridelabs-http stridelabs-auth stridelabs-testing stridelabs-mcp; do
            if ! git cat-file -e "$baseline:crates/${crate#stridelabs-}/Cargo.toml" 2>/dev/null; then
              echo "::notice::$crate is new since $baseline (no crates/${crate#stridelabs-}/Cargo.toml there), so it has no baseline API to check; it is checked from the next tag on"
              continue
            fi
            checked=$((checked + 1))
            echo "::group::cargo semver-checks -p $crate (baseline $baseline)"
            out="$(cargo semver-checks check-release -p "$crate" --all-features --baseline-rev "$baseline" 2>&1)"
            check_exit=$?
            echo "$out"
            if ! grep -q "Summary" <<<"$out"; then
              echo "::error::cargo semver-checks produced no 'Summary' line for $crate — it did not actually run the check (e.g. the --workspace publish=false no-op reappearing under -p). Failing loudly instead of passing vacuously."
              status=1
              failed="$failed $crate"
            elif [ "$check_exit" -ne 0 ]; then
              status=1
              failed="$failed $crate"
            fi
            echo "::endgroup::"
          done
          if [ "$checked" -eq 0 ]; then
            echo "::error::no crate was checked against $baseline; every crate was passed over as new, which cannot be right"
            status=1
          fi
          if [ "$status" -ne 0 ] && [ -n "$failed" ]; then
            echo "::error::cargo semver-checks failed for:$failed"
          fi
          exit "$status"

  # Its own job rather than a step in build-test: RustSec advisories are
  # time-varying (a new RUSTSEC ID can be published against a dependency this
  # repo hasn't touched between one commit and the next). `ci-success` therefore
  # requires it on every event except `pull_request` — main (push), manual
  # dispatch and the weekly schedule must be advisory-clean, so a red audit
  # can't sit unnoticed on main — while on a PR it is advisory, so a newly
  # published advisory can't brick an unrelated PR. A red run on a PR is a
  # signal for manual triage. deny.toml's `[advisories]` section mirrors this
  # job (the `cargo audit` step below says how an ignore is kept in sync) for
  # anyone running the full `cargo deny check` locally, but does not run in CI
  # itself.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-audit

      # No `--ignore` entries, so every advisory is live and a genuinely NEW one
      # stands out. If one is ever added it must be mirrored in deny.toml's
      # [advisories].ignore, assessed in writing, and removed the moment it is
      # fixed upstream or the reachability assessment changes — and only after
      # `cargo audit` on the committed lock shows it gone (`cargo tree` cannot
      # prove that: lock-only entries are invisible to it). The last one,
      # RUSTSEC-2023-0071 (rsa), was removed that way when sqlx 0.9 dropped
      # rsa from the lock; the "no rsa" guard in build-test keeps it out.
      - name: cargo audit
        run: cargo audit

  # Does the candidate still build and pass for a real consumer? limen is the
  # one consumer checked here: it is public, so this log is public too, and it
  # needs no services and no secrets. tapper, slauth and spendwise-rs are
  # private, and a public Actions log would publish their failing test output,
  # so scripts/downstream-check.sh checks them locally, before a tag.
  #
  # limen is checked out at a pinned commit SHA, never at a branch: a branch
  # moves under a PR, and this check must say the same thing on a re-run.
  # `[patch]` points all six stridelabs-* crates at this checkout (the same
  # --config the script uses). The run is deliberately NOT `--locked`: limen's
  # lock names the pinned git crates, and the patched path packages (and what
  # they newly pull in) have to be resolved into it. So this is a drift
  # detector as well: it also notices a transitive release that breaks the
  # candidate. The "Prove the patch took effect" step fails the job if limen
  # names the library under a URL the patch does not key, or resolves a
  # stridelabs-* crate from anywhere but this checkout (a vendored copy has no
  # `source` either), which would otherwise "pass" by testing other code.
  #
  # It runs on `schedule` too (it is required there, see `ci-success`), unlike
  # `build-test`: that job is --locked, so a week with no commit changes
  # nothing for it, but this one re-resolves, so a week can change its result.
  # The failure shows as a red weekly run; unlike `audit` it opens no issue.
  downstream-limen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A limen `main` commit: the merge of limen#43, limen's migration to
      # v0.5.0. Pinned, not `main`, so a re-run checks the same code; advance
      # it deliberately when limen moves. Always a full 40-hex commit SHA (the
      # first step enforces it).
      LIMEN_REF: "66c53aa558c217e0546e38486199c319b52ab9c2"
    steps:
      - name: Require an immutable limen ref
        run: |
          if ! [[ "$LIMEN_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::LIMEN_REF='$LIMEN_REF' is not a full 40-hex commit SHA; a branch or tag name moves under this job"
            exit 1
          fi
          echo "ok: limen at $LIMEN_REF"

      # Side by side, not nested: limen is a plain package, and cargo would take
      # this repo's workspace root for its own if it sat inside this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: stridelabs-rust

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: charliek/limen
          ref: ${{ env.LIMEN_REF }}
          path: limen
          persist-credentials: false

      # limen's own toolchain (its rust-toolchain.toml), found through
      # rust-src-dir, which is also the directory the cache keys on.
      - name: Install Rust toolchain (from limen/rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rust-src-dir: limen
          build-warnings: deny

      # One definition of the override, passed to every cargo call as
      # `--config <file>`: the same [patch] scripts/downstream-check.sh gives
      # cargo inline, with explicit absolute paths into this checkout. All
      # six crates are listed whether or not limen uses them (an unused entry
      # only draws a cargo warning).
      - name: Point limen's stridelabs-rust dependency at this checkout
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/stridelabs-patch.toml"
          echo '[patch."https://github.com/charliek/stridelabs-rust.git"]' > "$patch"
          for c in config observability http auth testing mcp; do
            echo "stridelabs-$c = { path = \"$GITHUB_WORKSPACE/stridelabs-rust/crates/$c\" }" >> "$patch"
          done
          cat "$patch"
          echo "STRIDELABS_PATCH=$patch" >> "$GITHUB_ENV"

      # A [patch] whose version differs from limen's locked one (a release
      # bump: the lock says 0.4.0, the candidate is 0.5.0) is silently unused,
      # so move every locked stridelabs-* package onto it before proving it
      # took effect (the script's `adopt_patch`; keep the two in step).
      - name: Move limen's locked stridelabs packages onto the patch
        working-directory: limen
        run: |
          set -euo pipefail
          pkgs=$(sed -n 's/^name = "\(stridelabs-[a-z-]*\)"$/\1/p' Cargo.lock | sort -u)
          if [ -z "$pkgs" ]; then
            echo "::error::limen's Cargo.lock names no stridelabs-* package"
            exit 1
          fi
          args=()
          for p in $pkgs; do args+=(-p "$p"); done
          cargo update --config "$STRIDELABS_PATCH" "${args[@]}"

      # `cargo metadata` reads the patched graph the step above resolved and
      # lists every stridelabs-* package in it. There must be at least one, and
      # each must be this checkout's crate of that name: a path package (no
      # `source`) whose manifest is crates/<name>/Cargo.toml here. `source` alone
      # is not enough, since a vendored copy of the library has none either.
      # The script's `check_patched_graph` is the same check.
      - name: Prove the patch took effect
        working-directory: limen
        run: |
          set -euo pipefail
          crates=$(realpath "$GITHUB_WORKSPACE/stridelabs-rust/crates")
          pkgs="$RUNNER_TEMP/stridelabs-packages.txt"
          cargo metadata --format-version 1 --config "$STRIDELABS_PATCH" |
            jq -r '.packages[] | select(.name | startswith("stridelabs-")) | [.name, .version, (.source // "path"), .manifest_path] | @tsv' |
            sort > "$pkgs"
          cat "$pkgs"
          if [ ! -s "$pkgs" ]; then
            echo "::error::limen's graph has no stridelabs-* package; the check proved nothing"
            exit 1
          fi
          bad=0
          while IFS=$'\t' read -r name version source manifest; do
            dir=$(realpath "$(dirname "$manifest")")
            if [ "$source" != path ] || [ "$dir" != "$crates/${name#stridelabs-}" ]; then
              echo "::error::$name $version (source: $source, manifest: $manifest) is not this checkout's crates/${name#stridelabs-}: the [patch] did not apply to it"
              bad=1
            fi
          done < "$pkgs"
          [ "$bad" = 0 ] || exit 1
          echo "ok: every stridelabs-* package in limen's graph is this checkout's"

      # Format is not run: this repo cannot change limen's formatting.
      - name: Clippy (limen, all targets)
        working-directory: limen
        run: cargo clippy --config "$STRIDELABS_PATCH" --all-targets -- -D warnings

      - name: Test (limen)
        working-directory: limen
        run: cargo test --config "$STRIDELABS_PATCH" --all

  # Single required status check the branch ruleset gates on. Keeping it a
  # separate aggregator job means the required check name stays stable even as
  # the matrix of jobs grows.
  #
  # Per-event policy (every needed job's result is printed first):
  #   - build-test: must be `success`, except on `schedule`, where its own
  #     `if:` skips it, so `skipped` (or `success`) is accepted there.
  #   - audit: must be `success` on every event except `pull_request`; on a
  #     PR its result is printed but does not decide the outcome.
  #   - downstream-limen: must be `success` on every event, `schedule`
  #     included, because the job runs there too (its own comment says why).
  #     It is NOT advisory on a PR: a PR that breaks a real consumer is the
  #     case this job exists to catch.
  # A `skipped` or `cancelled` result never counts as success otherwise.
  #
  # `always()` so this still reports on a failed/cancelled needed job (that's
  # the whole point of the aggregator). It also runs on `schedule` so the
  # weekly run's conclusion reflects the audit and downstream-limen results.
  ci-success:
    needs: [build-test, audit, downstream-limen]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to have passed
        env:
          EVENT: ${{ github.event_name }}
          BUILD_TEST: ${{ needs.build-test.result }}
          AUDIT: ${{ needs.audit.result }}
          DOWNSTREAM_LIMEN: ${{ needs.downstream-limen.result }}
        run: |
          echo "event=$EVENT build-test=$BUILD_TEST audit=$AUDIT downstream-limen=$DOWNSTREAM_LIMEN"
          status=0
          if [ "$EVENT" = "schedule" ]; then
            if [ "$BUILD_TEST" != "skipped" ] && [ "$BUILD_TEST" != "success" ]; then
              echo "::error::build-test='$BUILD_TEST' on schedule (expected skipped)"
              status=1
            fi
          elif [ "$BUILD_TEST" != "success" ]; then
            echo "::error::build-test='$BUILD_TEST'"
            status=1
          fi
          if [ "$EVENT" = "pull_request" ]; then
            echo "audit='$AUDIT' is advisory on pull_request (not required)"
          elif [ "$AUDIT" != "success" ]; then
            echo "::error::audit='$AUDIT' (required on $EVENT)"
            status=1
          fi
          if [ "$DOWNSTREAM_LIMEN" != "success" ]; then
            echo "::error::downstream-limen='$DOWNSTREAM_LIMEN' (required on $EVENT)"
            status=1
          fi
          exit "$status"

  # A failing scheduled audit means a new advisory landed against a dependency
  # with no change here, and nobody is looking at the weekly run. Open an issue
  # labelled `security` (or comment on the one already open) so it is seen.
  # No checkout: `gh` only needs the repo name and the job's token, and
  # `issues: write` is granted to this job alone (the workflow default stays
  # `contents: read`).
  audit-issue:
    needs: audit
    if: always() && github.event_name == 'schedule' && needs.audit.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the scheduled-audit issue
        run: |
          set -euo pipefail
          title="Scheduled cargo audit is failing"
          labels="$(gh label list --search security --json name --jq '.[].name')"
          if ! grep -qx security <<<"$labels"; then
            # Tolerate losing a race to create it (no --force: that would
            # overwrite an existing label's colour/description). If the label
            # genuinely isn't there, `gh issue create --label` below fails loudly.
            gh label create security --color D93F0B --description "Security advisories and hardening" \
              || echo "::notice::label 'security' already exists (created concurrently)"
          fi
          number="$(gh issue list --label security --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "The scheduled \`cargo audit\` is still failing: $RUN_URL"
          else
            gh issue create --title "$title" --label security \
              --body "The scheduled \`cargo audit\` failed, so a RustSec advisory now applies to a locked dependency. Run: $RUN_URL"
          fi
