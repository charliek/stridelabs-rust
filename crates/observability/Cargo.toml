[package]
name = "stridelabs-observability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "tracing init (json/pretty), a request-id tower layer, and optional Prometheus wiring, for StrideLabs services"
publish = false

[features]
default = []
# Off by default: most consumers don't render `/metrics`, and pulling in the
# Prometheus exporter + `metrics` facade unconditionally would be dead weight
# for the ones that don't.
prometheus = ["dep:metrics", "dep:metrics-exporter-prometheus"]

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
rand = { workspace = true }
metrics = { workspace = true, optional = true }
metrics-exporter-prometheus = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
axum = { workspace = true }
