[package]
name = "stridelabs-observability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "tracing init (text, JSON, or Google Cloud Logging lines), request-id and request-logging tower layers, and optional Prometheus wiring, for StrideLabs services"
publish = false

[features]
default = []
# Off by default: most consumers don't render `/metrics`, and pulling in the
# Prometheus exporter + `metrics` facade unconditionally would be dead weight
# for the ones that don't.
prometheus = ["dep:metrics", "dep:metrics-exporter-prometheus"]
# Lets `RequestLogLayer` fall back to the connection's peer address for
# `remoteIp`. axum's `ConnectInfo<SocketAddr>` extension is the only place a
# peer address appears on an `http::Request`, and reading a typed extension
# means naming its type — so this is the one place the crate needs axum
# itself. Off by default: behind Cloud Run's front end `X-Forwarded-For`
# always carries the client, and every other layer stays plain tower/http.
axum = ["dep:axum"]

# The `prometheus` module's own tests cannot see this one: it needs a process
# where nothing has called `install()` yet (see the file's header).
[[test]]
name = "prometheus_concurrent_install"
required-features = ["prometheus"]

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The `log` bridge, which tracing-subscriber's `try_init` installs too, named
# directly so `try_init_logging_with` can tell a refused bridge from a refused
# subscriber (`try_init` folds both into one opaque error). Already in every
# consumer's graph, with these features, through tracing-subscriber's default
# `tracing-log` feature.
tracing-log = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
rand = { workspace = true }
# The Cloud Logging formatter writes its lines with it. Already in every
# consumer's graph through tracing-subscriber's `json` feature.
serde_json = { workspace = true }
metrics = { workspace = true, optional = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
# `LoggingInitError`, and the prometheus feature's recorder-installation error.
thiserror = { workspace = true }
# Only for the `axum` feature's `ConnectInfo` read (see the feature).
axum = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
axum = { workspace = true }
# Parses the Cloud formatter's timestamps back as RFC 3339 in tests; the
# formatter itself stamps lines with tracing-subscriber's own clock.
time = { workspace = true, features = ["parsing"] }
# Test-only strict JSON reading that rejects duplicate keys, which
# `serde_json::Value` silently collapses.
serde = { workspace = true }
# A never-ending stream for the server-sent-events test's body.
futures-util = { workspace = true }
