[package]
name = "stridelabs-testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Test-only helpers for StrideLabs services: fail-loud Postgres and Redis probes, axum oneshot request helpers, and a one-line wiremock JSON stub"
publish = false

[features]
default = []
# Off by default: `sqlx` pulls in a real Postgres driver, which only consumers
# whose *own* tests touch a database need. `oneshot` and `wiremock` have
# nothing to do with Postgres and are always available. The driver is built
# with NO sqlx TLS feature (see `workspace.dependencies.sqlx`): the pool talks
# to a local Postgres without TLS, and a TLS feature here would unify into the
# consumer's graph. CI's "Guard: stridelabs-testing pulls no ring" fails if a
# TLS feature brings `ring` back.
postgres = ["dep:sqlx"]
# Off by default for the same reason: a real Redis client, which only
# consumers whose own tests talk to Redis need. Built with NO redis-rs TLS
# feature (see `workspace.dependencies.redis`): the probe talks to a local or
# CI Redis in the clear, and adds no rustls to a consumer's test graph. It
# also adds `RedisDbPolicy` and `require_local_redis_url`, which ask redis-rs
# which database a URL selects.
redis = ["dep:redis"]

[lints]
workspace = true

[dependencies]
# `oneshot` — driving an axum Router without binding a socket.
axum = { workspace = true }
http = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# `wiremock` — a regular (non-dev) dependency on purpose: this crate is
# consumed from consumers' [dev-dependencies], so wiremock never reaches a
# production build regardless of which side of *this* manifest it's listed
# on. Declaring it here, rather than duplicating the version pin in every
# consumer, is the entire reason `stridelabs-testing` owns a `wiremock` module.
wiremock = { workspace = true }

# `require_local_url` reads a test URL's host with it, and the `postgres` and
# `redis` probes redact the password out of a connection string before it can
# reach a panic message. Not optional: wiremock (above) already puts this
# exact crate in every consumer's test graph, so gating it would save nothing.
url = { workspace = true }

# --- `postgres` only -------------------------------------------------------
# The workspace entry is only the driver and the runtime; these four are the
# features this crate has always built sqlx with (no TLS one: see the
# `postgres` feature above).
sqlx = { workspace = true, optional = true, features = [
    "uuid",
    "time",
    "migrate",
    "macros",
] }

# --- `redis` only ----------------------------------------------------------
redis = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Drives requests against the mock server started by `wiremock::serve_json`
# in that module's own tests.
reqwest = { workspace = true, features = ["json"] }
