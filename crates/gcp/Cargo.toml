[package]
name = "stridelabs-gcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Policy-free Google Cloud building blocks for StrideLabs services: an ADC access-token provider, a small GCS JSON-API client, and Vertex generateContent types"
publish = false

[features]
default = []
# Signing the RS256 JWT-bearer assertion a `service_account` key exchanges for
# a token. It is the only thing here that needs jsonwebtoken, and it needs
# `use_pem` (pem + simple_asn1 + their transitive crates) to read the key's
# PEM. Off by default: a service that runs only on ADC (the metadata server,
# or a developer's gcloud `authorized_user` login) never parses a PEM. With it
# off, a `service_account` credential is `GcpAuthError::Unsupported`, never a
# silent fallthrough to another identity. The backend stays the workspace's
# `aws_lc_rs` — never `rust_crypto` (see the root README, "One crypto
# provider").
service-account-key = ["dep:jsonwebtoken", "jsonwebtoken/use_pem"]
# Vertex AI `generateContent`: request/response types, the endpoint builder
# (global vs regional host) and the inline-image classifier. Code only; it
# adds no dependency.
vertex = []

[lints]
workspace = true

[dependencies]
# `form` for the two token-endpoint grants
# (`application/x-www-form-urlencoded`). `json` is no longer used here (Vertex
# serializes its body itself, once, so a `401` replay resends the same bytes)
# but stays on as in v0.8.0: turning it off could take `RequestBuilder::json`
# from a consumer that gets it only through this crate. Nothing else,
# TLS above all: like stridelabs-auth, this crate never builds a client — every
# constructor takes the consumer's — so the TLS stack and the process's rustls
# provider stay the consumer's choice. Its tests talk plain HTTP to wiremock.
reqwest = { workspace = true, features = ["json", "form"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `rt` to run each token refresh on a task of its own (no caller's
# cancellation reaches it), `sync` for the oneshot that carries its outcome to
# the waiters, `time` for the per-operation deadlines. A consumer of this crate
# is on tokio by construction (reqwest).
tokio = { workspace = true, features = ["rt", "sync", "time"] }
# `Shared`: every caller waiting on a refresh attempt awaits the same
# outcome. Already in the lock (stridelabs-http's `proxy`).
futures = { workspace = true }
tracing = { workspace = true }
# GCS object bodies in and out, without a copy through `Vec<u8>`.
bytes = { workspace = true }
base64 = { workspace = true }
percent-encoding = { workspace = true }
# `upload_with`'s multipart boundary: 128 random bits per candidate, from the
# OS-seeded thread RNG. Already in every StrideLabs service's graph through
# stridelabs-auth and stridelabs-observability.
rand = { workspace = true }
# Checking a candidate boundary against the parts it separates.
memchr = { workspace = true }

# --- feature-gated ---------------------------------------------------------
jsonwebtoken = { workspace = true, optional = true }

[dev-dependencies]
# `test-util` (not part of tokio's `full`) gives `start_paused`: the retry
# driver's schedule tests run on tokio's paused clock, with synthetic attempts
# (never a socket). Dev-only, as in stridelabs-http, so no consumer's graph
# and no `Cargo.lock` line changes.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = { workspace = true }
# Decoding the form bodies the token endpoints receive. Already in the lock
# (reqwest depends on it).
url = { workspace = true }
# The reference the hand-written RFC 3339 formatter (`customTime`) is checked
# against, across its whole range. Already in the lock (sqlx, simple_asn1);
# a dev-dependency only, so no consumer's graph gets it from here.
time = { workspace = true, features = ["formatting"] }
