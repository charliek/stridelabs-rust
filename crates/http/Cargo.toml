[package]
name = "stridelabs-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "axum error convention, security-header and CORS layers, and graceful-shutdown helpers for StrideLabs services"
publish = false

[features]
default = []
# Off by default: plenty of services are same-origin (or sit behind a gateway
# that owns CORS), and they shouldn't pay for tower-http's `cors` module in
# their dependency graph just to get `AppError` and the security headers.
cors = ["tower-http/cors"]
# Off by default for the same reason, only more so: the reverse-proxy
# primitives drag in an HTTP *client* and a TLS stack, which is a large thing
# to hand a service that only ever answers requests.
#
# `tokio/time` rides along because only `buffer_or_stream_within`'s pinned
# deadline timer needs a clock — the always-on `shutdown` module does not.
# Today the line is declarative rather than load-bearing: the workspace pins
# tokio with `full` (root Cargo.toml), so `time` is in every consumer's graph
# regardless. It stays here so the proxy feature keeps compiling on its own
# terms if that workspace pin is ever narrowed.
proxy = ["dep:reqwest", "dep:url", "dep:bytes", "dep:futures", "tokio/time"]
# Off by default: `utoipa` brings a proc-macro crate (`utoipa-gen`, hence syn)
# along with it, and a service that doesn't publish an OpenAPI document —
# or one that publishes it some other way — shouldn't compile that to get
# `AppError` and the security headers.
openapi = ["dep:utoipa"]
# Off by default, like `proxy` and for the same reason: an SSRF-guarded fetch
# is an HTTP client and a TLS stack (the same reqwest dependency `proxy` uses,
# so a service with both compiles it once). `tokio/time` is the fetch's
# wall-clock budget and `tokio/net` the system resolver (`lookup_host`);
# like `proxy`'s `tokio/time` they are declarative under the workspace's
# `full` pin, and keep the feature compiling on its own terms if that is ever
# narrowed.
ssrf = ["dep:reqwest", "dep:url", "dep:bytes", "dep:futures", "tokio/time", "tokio/net"]
# Test-only: `ssrf::LoopbackTestServer`, which lets a policy reach named
# loopback addresses through one private CA — what proving the pinning
# against a real TLS server takes, and exactly what the strict policy
# refuses. A feature of its own, not part of `ssrf`, so a build without it
# has no such code at all; with it, nothing is admitted until a caller asks
# by name. Consumers enable it from `[dev-dependencies]` — which a plain
# `cargo build` leaves out, though `--all-targets` or another workspace
# member's normal dependency can unify it in — and should check the shipped
# graph for it (`ssrf` module docs).
ssrf-test-support = ["ssrf"]
# Off by default: one function, but a direct `rustls` dependency, which a
# service with no rustls in its graph has no reason to take on.
tls = ["dep:rustls"]

[lints]
workspace = true

# Process-global rustls state: alone in its own test binary (Cargo runs each
# file under `tests/` as its own process), and only built when there is a
# provider install to test.
[[test]]
name = "tls_provider"
required-features = ["tls"]

# The pinning, proven against a local TLS server: needs the loopback override.
[[test]]
name = "ssrf_pinning"
required-features = ["ssrf-test-support"]

[dependencies]
axum = { workspace = true }
# The same `http` crate axum re-exports; used directly so the layers here stay
# axum-compatible without every module reaching through `axum::http`.
http = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["set-header"] }
# Non-optional: `shutdown` is signal/watch machinery, and a service that
# doesn't already depend on tokio has nothing to gracefully shut down. Gating
# it would buy no consumer a leaner graph.
tokio = { workspace = true, features = ["macros", "signal", "sync"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

# --- `proxy` and `ssrf` ----------------------------------------------------
# `stream` is not in reqwest's default set, and everything in `proxy` is built
# on it: `Response::bytes_stream` is what lets a body be relayed without ever
# being held in memory, and what lets `buffer_or_stream` bail out to streaming
# mid-body once it crosses the cap. `ssrf`'s capped read counts the same
# stream.
#
# `rustls` (reqwest 0.13's rename of 0.12's `rustls-tls`) is the only reqwest
# TLS feature anywhere in this workspace (see the workspace manifest; the
# other rustls users are this crate's `tls` and stridelabs-redis's redis-rs,
# neither of which picks a provider for reqwest). It brings
# rustls's aws-lc-rs provider — used unless the process installed a default
# provider first — and the OS trust store with no bundled roots; the README's
# "Feature topology" says what that means for a consumer's image. Still no
# openssl. Not `rustls-no-provider`: that panics at `Client` build unless the
# consumer installed a provider first.
reqwest = { workspace = true, features = ["stream", "rustls"], optional = true }
url = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

# --- `tls` only -----------------------------------------------------------
# Declared for `rustls::crypto::aws_lc_rs::default_provider()` and nothing
# else. `default-features = false` so this line adds none of rustls's own
# defaults (logging, tls12, prefer-post-quantum) to a consumer's graph;
# `aws_lc_rs` is the one provider the workspace allows; `std` is already on
# for every rustls user here (reqwest, tokio-rustls) and backs the process
# default with std's `OnceLock`. Never `ring`: next to aws-lc-rs it is the
# second provider that makes `ClientConfig::builder()` panic. The same
# features as slauth's direct rustls dependency, so the two unify to nothing
# new.
rustls = { version = "0.23", default-features = false, features = [
    "aws_lc_rs",
    "std",
], optional = true }

# --- `openapi` only -------------------------------------------------------
# Default features on, so `utoipa`'s derive macros (`macros` -> `utoipa-gen`)
# come along: this module's own tests and doc examples build documents with
# `#[derive(OpenApi)]`, and so does every consumer.
utoipa = { workspace = true, optional = true }

[dev-dependencies]
# `preserve_order` turns every `serde_json::Map` into an insertion-ordered
# `IndexMap` instead of the default `BTreeMap` — which is precisely the
# hazard `openapi::to_pretty_json` exists to be immune to, and which cannot
# be reproduced any other way: with the feature off, a `Value::Object` IS a
# `BTreeMap` and is sorted before `canonicalize` ever sees it, so the
# canonicalization tests would assert nothing at all.
#
# Enabling it HERE, in dev-dependencies, is what keeps that honest without
# inflicting it on anyone: under resolver v2 dev-dependency features are
# unified into the build graph only for targets that need dev-deps (`cargo
# test`, `cargo clippy --all-targets`), never for `cargo build` — so no
# consumer's production graph is touched, and `--no-default-features` builds
# are unaffected. The tests assert the feature is actually on before relying
# on it, so if this line is ever dropped they fail loudly instead of going
# quietly vacuous.
serde_json = { workspace = true, features = ["preserve_order"] }
# `test-util` (not part of tokio's `full`) gives `start_paused`, so the
# shutdown tests assert "does not resolve yet" without a real sleep.
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "test-util",
] }
# Used only by the `proxy` tests (which are themselves feature-gated), but
# dev-dependencies cannot be feature-gated. It costs consumers nothing — dev
# deps never enter a downstream graph.
wiremock = { workspace = true }
# The `proxy::upstream` leak tests install a capturing subscriber and assert on
# the bytes it wrote — that no upstream URL or query string is among them.
# Nothing short of a real subscriber can prove that: `tracing` on its own
# records fields into a visitor that, with no subscriber installed, is never
# called. Dev-only, so no consumer's graph is touched.
tracing-subscriber = { workspace = true }
# Same deal: only the `openapi` tests use it, to write a committed-spec file
# the freshness check can be pointed at. Matches `stridelabs-config`'s
# dev-dependency on it (declared per-crate; nothing else in the workspace
# shares the pin).
tempfile = "3"
# The `ssrf_pinning` tests' local TLS server: a throwaway CA and leaf
# certificates for made-up names (`images.test`), generated per test.
# `aws_lc_rs`, never the default `ring`: CI's "the workspace compiles no ring"
# guard lists dev edges too, and one ring anywhere fails it. `pem` because the
# CA reaches `LoopbackTestServer` as a PEM bundle, the way a consumer's would.
rcgen = { version = "0.14", default-features = false, features = [
    "aws_lc_rs",
    "pem",
] }
# Terminates TLS for that server. `default-features = false` drops its
# `logging` and `tls12` (the client speaks TLS 1.3) and, with `aws_lc_rs`
# named, keeps its rustls on the one allowed provider; the server config is
# built with that provider explicitly, so the tests install no process default.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "aws_lc_rs",
] }
