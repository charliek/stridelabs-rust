services:
  postgres:
    image: postgres:16-alpine
    container_name: stridelabs-rust-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: stridelabs_test
    ports:
      # 5438, not spendwise-rs's 5437, so both stacks can run locally at once.
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
