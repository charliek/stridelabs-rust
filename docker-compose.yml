services:
  postgres:
    image: postgres:16-alpine
    container_name: stridelabs-rust-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: stridelabs_test
    ports:
      # 5438 by default, to avoid colliding with other local stacks; another
      # stack can still hold it (cadence does), so STRIDELABS_PG_PORT overrides.
      - "${STRIDELABS_PG_PORT:-5438}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # For stridelabs-testing's `require_redis` and stridelabs-redis's live suite
  # (both in the all-features lane). No password and no volume: the tests use
  # unique keys and need nothing to survive a restart.
  redis:
    image: redis:7-alpine
    container_name: stridelabs-rust-redis
    ports:
      # 6390 by default, clear of the 6379 every other local stack takes;
      # STRIDELABS_REDIS_PORT overrides (and REDIS_URL then points the tests
      # at it).
      - "${STRIDELABS_REDIS_PORT:-6390}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
