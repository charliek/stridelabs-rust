# cargo-deny configuration.
#
# Matched to this workspace's own dependency graph — the allow-list
# below was derived from a real `mise exec -- cargo deny check licenses` run
# against this repo's Cargo.lock under `--all-features` (315 crates, 12
# distinct license terms once dev-only/all-features-only branches like
# stridelabs-testing's sqlx feature are included), not copied blind. See the
# C5 commit / plan 002 §W5 for the source audit.
#
# Wired into CI as a three-section check (`cargo deny check licenses bans
# sources`, see .github/workflows/ci.yml's build-test job) — the
# `[advisories]` section below exists for local/manual `cargo deny check`
# (all sections) runs, but deliberately does NOT run as a CI gate; see the
# note on `[advisories]` for why.
#
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# The workspace's own dependency graph across every feature combination —
# `--all-features` is what CI's clippy/test/doc steps already build with, and
# is what the license/advisory sweep in c7-disclosure-and-advisory.md audited
# against, so this must match. (EmbarkStudios/cargo-deny-action's own
# `arguments` input also defaults to `--all-features` on the CI side — a
# harmless overlap with this setting, not a conflict; this file is the
# authoritative source of truth either way, since it's also what a local
# `mise exec -- cargo deny check` picks up with no flags at all.)
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Deliberately NOT run in CI (see .github/workflows/ci.yml: the build-test
# job's cargo-deny step is scoped to `check licenses bans sources` only). A
# separate `audit` job runs `cargo-audit` instead — advisories are
# time-varying (a new RUSTSEC ID can land between commits with no code
# change), so it gates main, manual runs and the weekly schedule but is
# advisory on pull requests, where it would otherwise brick unrelated PRs.
# Splitting the concerns this way means exactly one tool (cargo-audit) owns
# "is there a live advisory," and cargo-deny here owns licenses/bans/sources
# only. This section is kept accurate anyway for whoever runs the full
# `cargo deny check` locally, so it doesn't disagree with the audit job's
# published assessment.
#
# No `ignore` entries, and none on CI's `cargo audit` step either (keep the two
# in sync if one is ever added). The last one, RUSTSEC-2023-0071 (rsa, Marvin
# timing side-channel, no upstream fix), was dropped once sqlx 0.9 took `rsa`
# out of Cargo.lock; CI's "Guard: no rsa in Cargo.lock" step keeps it out.

[licenses]
# Licenses allowed for any crate in the dependency graph. Base set is the
# permissive baseline (MIT / Apache-2.0 / Apache-2.0 WITH LLVM-exception /
# BSD-2-Clause / BSD-3-Clause), extended with the non-obvious entries this
# graph actually needs, each justified from
# the real `cargo deny list` output (c7-disclosure-and-advisory.md §B3):
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # unicode-ident and friends (unicode-ident, unicode-width, ...) ship
    # under the Unicode data-and-software license's 2024 successor term.
    # Permissive.
    "Unicode-3.0",
    # The crypto underneath TLS and JWT: aws-lc-rs/aws-lc-sys (rustls's
    # provider under reqwest 0.13's `rustls`, and jsonwebtoken 11's
    # `aws_lc_rs` backend), rustls-webpki, untrusted, and simple_asn1
    # (jsonwebtoken's PEM support). Permissive. ring left this graph with
    # jsonwebtoken 9; its remaining Cargo.lock entry is lock-only (edges from
    # quinn-proto, behind reqwest's optional quinn, and from rustls-webpki's
    # off `ring` feature), so nothing compiles it and cargo-deny never sees it.
    "ISC",
    # webpki-root-certs (Mozilla's root CA bundle). reqwest 0.13 bundles no
    # roots any more (0.12's webpki-roots is gone from the lock); this one is
    # rustls-platform-verifier's wasm32-only fallback, so nothing built for a
    # real target compiles it, but this file's graph spans every target. A data
    # license covering the cert bundle, not code — permissive in substance.
    "CDLA-Permissive-2.0",
    # ryu (float-to-string formatting, transitive via serde_json). Permissive
    # (Boost Software License).
    "BSL-1.0",
    # aho-corasick / memchr (both dual-license "MIT OR Unlicense"; regex's
    # dependency chain). Permissive public-domain-equivalent.
    "Unlicense",
    # foldhash (transitive via hashbrown, itself transitive via sqlx-core and
    # metrics-util). Permissive. Only shows up under `--all-features`
    # (stridelabs-testing's sqlx feature), which is why an
    # all-features-only-graph scan is required to find it — see `[graph]`
    # above.
    "Zlib",
]
# r-efi 5.3.0/6.0.0 is NOT in the allow-list above despite carrying
# LGPL-2.1-or-later: its actual Cargo.toml license field is the disjunctive
# SPDX expression "MIT OR Apache-2.0 OR LGPL-2.1-or-later" (verified via the
# crate's own manifest, both versions in the lockfile). cargo-deny satisfies
# an OR expression if ANY one term is allowed — MIT and Apache-2.0 already
# are — so no `licenses.exceptions` entry is needed; the LGPL branch is
# simply the alternative this graph doesn't take. r-efi itself is also
# target-gated: it reaches the graph only via getrandom's UEFI backend
# (`cargo tree -i r-efi@5.3.0/6.0.0 --target all --all-features`), never
# compiled for the linux/macos targets this workspace actually ships to.
confidence-threshold = 0.8

[bans]
# Default posture kept: multiple versions of the same crate in the graph
# (e.g. r-efi 5.3.0 AND 6.0.0, syn 2.x AND 3.x) are normal in a resolved
# graph of 300-odd crates and not, by themselves, a problem worth failing CI
# over.
multiple-versions = "allow"

[sources]
# Defaults kept — every dependency here resolves from crates.io; nothing in
# this workspace pulls a crate from an arbitrary git remote or a private
# registry, so denying unknown sources costs nothing and catches a future
# supply-chain surprise (e.g. a typo'd `git =` dependency) for free.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
